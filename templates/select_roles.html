<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Roles – CV Screening</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='voice.js') }}"></script>
</head>
<body>
    <!-- VOICE HEADER (same as index) -->
    <div class="d-flex justify-content-end align-items-center gap-3 p-2" style="background: #f8f9fa; border-bottom: 1px solid #dee2e6;">
        <span><i class="fas fa-language"></i> Language:</span>
        <select id="langSelect" class="form-select form-select-sm" style="width: auto;" onchange="setLanguage(this.value)">
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
            <option value="es-ES">Español</option>
            <option value="fr-FR">Français</option>
            <option value="de-DE">Deutsch</option>
            <option value="zh-CN">中文 (Chinese)</option>
            <option value="hi-IN">हिन्दी (Hindi)</option>
        </select>
        <button id="micBtn" class="btn btn-outline-primary btn-sm" onclick="startVoiceCommand()">
            <i class="fas fa-microphone"></i> Voice
        </button>
        <button id="stopBtn" class="btn btn-outline-danger btn-sm" style="display:none;" onclick="stopSpeaking()">
            <i class="fas fa-stop-circle"></i> Stop
        </button>
    </div>

    <div class="header text-center">
        <div class="container">
            <h1><i class="fas fa-robot"></i> AI CV Screening System</h1>
            <p class="lead">Select the roles you want to screen against.</p>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-4">
                    <h5 class="card-title"><i class="fas fa-briefcase"></i> Extracted Roles</h5>
                    <p class="text-muted">The system found the following roles in your criteria document. Choose one or more to screen CVs against.</p>
                    <form action="/start_screening" method="post" id="roleForm">
                        <div class="mb-3">
                            {% for role in roles %}
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="role_indices" value="{{ loop.index0 }}" id="role_{{ loop.index0 }}">
                                <label class="form-check-label" for="role_{{ loop.index0 }}">
                                    <strong>{{ role.name }}</strong>
                                    <button type="button" class="btn btn-sm btn-outline-secondary ms-2" 
                                            onclick="speakRole('{{ role.name }}', '{{ role.degree_level or 'Not specified' }}', '{{ role.experience_years or 'N/A' }}')">
                                        <i class="fas fa-volume-up"></i>
                                    </button>
                                    <span class="text-muted">(Degree: {{ role.degree_level or 'Not specified' }}, Exp: {{ role.experience_years or 'N/A' }})</span>
                                    <br><small class="text-secondary">{{ role.requirements|length }} requirements</small>
                                </label>
                            </div>
                            {% endfor %}
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="selectAll">
                                <label class="form-check-label" for="selectAll"><strong>Select All</strong></label>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="startBtn">
                            <i class="fas fa-play"></i> Start Screening for Selected Roles
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function speakRole(name, degree, exp) {
            let text = `Role: ${name}. `;
            if (degree && degree !== 'Not specified') text += `Required degree: ${degree}. `;
            if (exp && exp !== 'N/A' && exp > 0) text += `Minimum experience: ${exp} years. `;
            const selected = document.querySelectorAll('input[name="role_indices"]:checked').length;
            text += `You have selected ${selected} roles.`;
            await speakText(text);
        }

        document.getElementById('selectAll').addEventListener('change', function() {
            const checkboxes = document.querySelectorAll('input[name="role_indices"]');
            for (let cb of checkboxes) {
                cb.checked = this.checked;
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            const roleCheckboxes = document.querySelectorAll('input[name="role_indices"]');
            const roleLabels = document.querySelectorAll('.form-check-label strong');
            const roleNames = Array.from(roleLabels).map(el => el.textContent.trim());

            setVoiceCommandHandler(async function(command, original) {
                const lower = command.toLowerCase();

                if (lower.includes('select all') || lower.includes('all roles')) {
                    roleCheckboxes.forEach(cb => cb.checked = true);
                    document.getElementById('selectAll').checked = true;
                    await speakText('All roles selected.');
                    return;
                }
                if (lower.includes('clear') || lower.includes('deselect') || lower.includes('unselect')) {
                    roleCheckboxes.forEach(cb => cb.checked = false);
                    document.getElementById('selectAll').checked = false;
                    await speakText('Cleared all selections.');
                    return;
                }
                if (lower.includes('start') || lower.includes('go') || lower.includes('screen')) {
                    document.getElementById('roleForm').submit();
                    return;
                }
                if (lower.includes('read') || lower.includes('tell me')) {
                    const names = roleNames.map(n => n.charAt(0).toUpperCase() + n.slice(1));
                    await speakText('Available roles: ' + names.join(', '));
                    return;
                }

                let parts = lower.split(/[,.]?\s+and\s+|[,.]+\s*/).map(p => p.trim());
                let foundAny = false;
                for (let part of parts) {
                    let clean = part.replace(/^(select|choose|pick)\s+/, '').trim();
                    let matched = null;
                    for (let i = 0; i < roleNames.length; i++) {
                        if (roleNames[i].toLowerCase().includes(clean) || clean.includes(roleNames[i].toLowerCase())) {
                            matched = i;
                            break;
                        }
                    }
                    if (matched !== null) {
                        roleCheckboxes[matched].checked = true;
                        foundAny = true;
                    }
                }
                if (foundAny) {
                    await speakText('Selected the roles you mentioned.');
                    return;
                }

                await speakText('Commands: "select all", "clear", "start", "read roles", or "select [role name]"');
            });
        });
    </script>
</body>
</html>
