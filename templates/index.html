<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Screening System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='voice.js') }}"></script>
</head>
<body>
    <!-- VOICE HEADER (unchanged) -->
    <div class="d-flex justify-content-end align-items-center gap-3 p-2" style="background: #f8f9fa; border-bottom: 1px solid #dee2e6;">
        <span><i class="fas fa-language"></i> Language:</span>
        <select id="langSelect" class="form-select form-select-sm" style="width: auto;" onchange="setLanguage(this.value)">
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
            <option value="es-ES">Español</option>
            <option value="fr-FR">Français</option>
            <option value="de-DE">Deutsch</option>
            <option value="zh-CN">中文 (Chinese)</option>
            <option value="hi-IN">हिन्दी (Hindi)</option>
        </select>
        <button id="micBtn" class="btn btn-outline-primary btn-sm" onclick="startVoiceCommand()">
            <i class="fas fa-microphone"></i> Voice
        </button>
        <button id="stopBtn" class="btn btn-outline-danger btn-sm" style="display:none;" onclick="stopSpeaking()">
            <i class="fas fa-stop-circle"></i> Stop
        </button>
    </div>

    <div class="header text-center">
        <div class="container">
            <h1><i class="fas fa-robot"></i> AI CV Screening System</h1>
            <p class="lead">Upload criteria document and CVs – let AI do the heavy lifting.</p>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card p-4">
                    <h5 class="card-title"><i class="fas fa-file-alt"></i> Recruiter Criteria</h5>
                    <form action="/process" method="post" enctype="multipart/form-data" id="uploadForm">
                        <div class="mb-3">
                            <label for="criteria_file" class="form-label">Upload Criteria (MS Word .docx)</label>
                            <div class="file-upload-area" id="criteriaDropArea">
                                <i class="fas fa-file-word"></i>
                                <p class="mt-2">Click or drag to select .docx file</p>
                                <input type="file" class="d-none" id="criteria_file" name="criteria_file" accept=".docx" required>
                            </div>
                            <div id="criteriaFileInfo" class="mt-2 text-muted"></div>
                        </div>

                        <div class="mb-3">
                            <label for="zip_file" class="form-label">Upload ZIP with CVs (PDF)</label>
                            <div class="file-upload-area" id="zipDropArea">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <p class="mt-2">Click or drag to select ZIP file</p>
                                <input type="file" class="d-none" id="zip_file" name="zip_file" accept=".zip" required>
                            </div>
                            <div id="zipFileInfo" class="mt-2 text-muted"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100" id="submitBtn">
                            <i class="fas fa-play"></i> Start Screening
                        </button>
                    </form>
                </div>
                <div class="card p-3 bg-light mt-3">
                    <small><i class="fas fa-info-circle"></i> Ensure your ZIP contains only PDF files (subfolders allowed). Criteria document must be a .docx file.</small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Drag‑and‑drop (same as before)
        const criteriaDrop = document.getElementById('criteriaDropArea');
        const criteriaInput = document.getElementById('criteria_file');
        const criteriaInfo = document.getElementById('criteriaFileInfo');

        criteriaDrop.addEventListener('click', () => criteriaInput.click());
        criteriaDrop.addEventListener('dragover', (e) => {
            e.preventDefault();
            criteriaDrop.style.borderColor = '#2a5298';
            criteriaDrop.style.background = '#e9f0ff';
        });
        criteriaDrop.addEventListener('dragleave', () => {
            criteriaDrop.style.borderColor = '#ced4da';
            criteriaDrop.style.background = 'transparent';
        });
        criteriaDrop.addEventListener('drop', (e) => {
            e.preventDefault();
            criteriaDrop.style.borderColor = '#ced4da';
            criteriaDrop.style.background = 'transparent';
            if (e.dataTransfer.files.length) {
                criteriaInput.files = e.dataTransfer.files;
                updateFileInfo(criteriaInput.files[0], criteriaInfo, 'file-word');
            }
        });
        criteriaInput.addEventListener('change', () => {
            if (criteriaInput.files.length) {
                updateFileInfo(criteriaInput.files[0], criteriaInfo, 'file-word');
            }
        });

        const zipDrop = document.getElementById('zipDropArea');
        const zipInput = document.getElementById('zip_file');
        const zipInfo = document.getElementById('zipFileInfo');

        zipDrop.addEventListener('click', () => zipInput.click());
        zipDrop.addEventListener('dragover', (e) => {
            e.preventDefault();
            zipDrop.style.borderColor = '#2a5298';
            zipDrop.style.background = '#e9f0ff';
        });
        zipDrop.addEventListener('dragleave', () => {
            zipDrop.style.borderColor = '#ced4da';
            zipDrop.style.background = 'transparent';
        });
        zipDrop.addEventListener('drop', (e) => {
            e.preventDefault();
            zipDrop.style.borderColor = '#ced4da';
            zipDrop.style.background = 'transparent';
            if (e.dataTransfer.files.length) {
                zipInput.files = e.dataTransfer.files;
                updateFileInfo(zipInput.files[0], zipInfo, 'file-archive');
            }
        });
        zipInput.addEventListener('change', () => {
            if (zipInput.files.length) {
                updateFileInfo(zipInput.files[0], zipInfo, 'file-archive');
            }
        });

        function updateFileInfo(file, infoElement, iconClass) {
            infoElement.innerHTML = `<i class="fas fa-${iconClass}"></i> ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
        }

        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
        });

        // Voice command handler for index page
        document.addEventListener('DOMContentLoaded', function() {
            setVoiceCommandHandler(async function(command, original) {
                const lower = command.toLowerCase();
                if (lower.includes('upload') || lower.includes('choose file') || lower.includes('select file')) {
                    document.getElementById('criteria_file').click();
                    await speakText('Opening file picker for criteria document.');
                } else if (lower.includes('zip') || lower.includes('cvs') || lower.includes('cv')) {
                    document.getElementById('zip_file').click();
                    await speakText('Opening file picker for CV zip.');
                } else if (lower.includes('start') || lower.includes('go') || lower.includes('process') || lower.includes('submit')) {
                    document.getElementById('submitBtn').click();
                } else {
                    await speakText('Commands: upload, zip, start.');
                }
            });
        });
    </script>
</body>
</html>
